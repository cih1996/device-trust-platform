plugins { id 'com.android.application' }
android {
    namespace 'com.device.trust.sample'
    compileSdk 35
    defaultConfig {
        applicationId 'com.device.trust.sample'; minSdk 24; targetSdk 35; versionCode 16; versionName '0.7.10'
        def publicAppId=providers.environmentVariable('DTP_DEMO_APP_ID').getOrElse('')
        if(publicAppId.isEmpty())throw new GradleException('DTP_DEMO_APP_ID is required')
        buildConfigField 'String', 'DEMO_APP_ID', '"'+publicAppId+'"'
        testInstrumentationRunner 'com.device.trust.sample.DeviceTrustInstrumentation'
        def pin = providers.environmentVariable('DTP_DEMO_PIN').getOrElse('')
        if (pin.isEmpty()) throw new GradleException('DTP_DEMO_PIN is required for the secured APK')
        def endpoint = providers.environmentVariable('DTP_DEMO_URL').getOrElse('https://localhost:9444')
        buildConfigField 'String', 'DEMO_URL', '"' + endpoint + '"'
        // The public experience login is published on purpose; it is prefilled in the app.
        def demoPassword = providers.environmentVariable('DTP_DEMO_PASSWORD').getOrElse('')
        if (demoPassword.isEmpty()) throw new GradleException('DTP_DEMO_PASSWORD is required')
        buildConfigField 'String', 'DEMO_PASSWORD', '"' + demoPassword + '"'
        buildConfigField 'String[]', 'SERVER_PINS', 'new String[]{"' + pin + '"}'
    }
    buildFeatures { buildConfig true }
    testBuildType 'release'
    signingConfigs {
        testRelease {
            storeFile file(providers.environmentVariable('DTP_RELEASE_KEYSTORE').getOrElse('../../work/signing/release.jks'))
            storePassword providers.environmentVariable('DTP_STORE_PASSWORD').getOrElse('')
            keyAlias 'release'
            keyPassword providers.environmentVariable('DTP_STORE_PASSWORD').getOrElse('')
        }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.testRelease; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation project(':sdk')
    implementation project(':sdk-environment')
    implementation project(':sdk-rootbeer')
    implementation project(':sdk-secure')
}

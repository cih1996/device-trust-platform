plugins { id 'com.android.application' }
android {
    namespace 'com.device.trust.sample'
    compileSdk 35
    defaultConfig {
        applicationId 'com.device.trust.sample'; minSdk 24; targetSdk 35; versionCode 4; versionName '0.4.0'
        def pin = providers.environmentVariable('DTP_DEMO_PIN').getOrElse('')
        if (pin.isEmpty()) throw new GradleException('DTP_DEMO_PIN is required for the secured APK')
        buildConfigField 'String', 'DEMO_URL', '"https://localhost:9444"'
        buildConfigField 'String[]', 'SERVER_PINS', 'new String[]{"' + pin + '"}'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        testRelease {
            storeFile file(providers.environmentVariable('DTP_RELEASE_KEYSTORE').getOrElse('../../work/signing/release.jks'))
            storePassword providers.environmentVariable('DTP_STORE_PASSWORD').getOrElse('')
            keyAlias 'release'
            keyPassword providers.environmentVariable('DTP_STORE_PASSWORD').getOrElse('')
        }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.testRelease; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation project(':sdk')
    implementation project(':sdk-environment')
    implementation project(':sdk-rootbeer')
    implementation project(':sdk-secure')
}

<div class="device-workspace">
 <p v-if="error" role="alert" class="error">{{error}}</p>
 <template v-if="!selected">
  <div class="device-metrics"><article><span>累计设备</span><strong>{{listing.stats.total}}</strong></article><article><span>24 小时活跃</span><strong>{{listing.stats.active}}</strong></article><article><span>参数存在矛盾</span><strong>{{listing.stats.conflict}}</strong></article><article><span>信息待补充</span><strong>{{listing.stats.incomplete}}</strong></article></div>
  <section class="panel inventory"><div class="panel-title"><div><h2>设备档案</h2><p class="muted">{{listing.total}} 台设备</p></div><form class="inventory-search" @submit.prevent="search"><input v-model="query" aria-label="搜索设备" placeholder="设备 ID、机型、品牌或 IP"><button :disabled="busy">搜索</button></form></div>
   <div class="table-scroll"><table><thead><tr><th>机型 / 设备 ID</th><th>应用</th><th>硬件概况</th><th>环境比对</th><th>关联账号</th><th>上报 / 业务</th><th>最近活跃</th><th></th></tr></thead><tbody><tr v-for="item in listing.items" :key="item.id"><td><strong>{{model(item)}}</strong><small>{{brand(item)}}</small><code class="device-id-small">{{item.deviceId||'历史安装档案'}}</code></td><td>{{appName(item.appId)}}</td><td>{{hardware(item)}}</td><td><span :class="['device-status',stateClass(item)]">{{state(item)}}</span><small>{{proof(item.latestReport.proof)}}</small></td><td>{{item.accountCount}}</td><td>{{item.reportCount}} / {{item.eventCount}}</td><td>{{date(item.lastSeen)}}</td><td><button class="quiet" @click="open(item)" :disabled="busy">查看档案 ↗</button></td></tr></tbody></table></div>
   <div v-if="!listing.items.length" class="empty">暂无符合条件的设备</div><div class="device-pagination"><span>{{offset+1>listing.total?listing.total:offset+1}}–{{Math.min(offset+50,listing.total)}} / {{listing.total}}</span><button class="quiet" :disabled="busy||offset===0" @click="page(-1)">上一页</button><button class="quiet" :disabled="busy||offset+50>=listing.total" @click="page(1)">下一页</button></div>
  </section>
 </template>
 <template v-else>
  <div class="device-topbar"><button class="quiet" @click="close">← 返回设备列表</button><div><button class="quiet" @click="exportRecord">导出当前档案 ↓</button><button class="quiet danger-text" v-if="r.proof" @click="revoke" :disabled="busy||p.keyStatus==='revoked'">停用密钥</button></div></div>
  <section class="panel device-identity"><div class="device-monogram">{{brand(p).slice(0,1)}}</div><div><span class="eyebrow">DEVICE PROFILE</span><h2>{{model(p)}}</h2><p>{{brand(p)}} · {{appName(p.appId)}}</p><code class="identity-code">{{p.deviceId||'历史安装档案'}}</code></div><div class="identity-badges"><span class="badge">{{proof(r.proof)}}</span><span :class="['device-status',stateClass(p)]">{{state(p)}}</span></div></section>
  <nav class="device-tabs" aria-label="设备档案分区"><button v-for="(label,key) in {overview:'档案概览',hardware:'机型与系统',apps:'应用与签名',network:'网络与定位',history:'关联与轨迹',raw:'原始数据'}" :class="{active:tab===key}" @click="tab=key">{{label}}</button></nav>
  <template v-if="tab==='overview'">
   <div class="device-metrics"><article><span>设备上报</span><strong>{{p.reportCount}}</strong></article><article><span>关联账号</span><strong>{{p.accountCount}}</strong></article><article><span>业务事件</span><strong>{{p.eventCount}}</strong></article><article><span>已采集项目</span><strong>{{completeness.available}}<small> / {{completeness.total}}</small></strong></article></div>
   <div class="device-columns"><section class="panel"><h3>登记信息</h3><dl class="record-fields"><dt>设备 ID</dt><dd>{{p.deviceId||'历史上报未登记'}}</dd><dt>首次登记</dt><dd>{{p.registeredAt?date(p.registeredAt):'未登记'}}</dd><dt>首次出现</dt><dd>{{date(p.firstSeen)}}</dd><dt>最近活跃</dt><dd>{{date(p.lastSeen)}}</dd><dt>最近上报</dt><dd>{{purpose(r.purpose)}}</dd><dt>机型信息</dt><dd>{{hardware(p)}}</dd><dt>应用包名</dt><dd>{{r.package}}</dd><dt>最近业务风险分</dt><dd>{{p.eventCount?p.riskScore:'尚无业务事件'}}</dd></dl></section><section class="panel"><resource-panel :assessment="r.resources"></resource-panel></section></div>
  </template>
  <template v-if="tab==='hardware'"><div class="device-columns"><section class="panel" v-for="group in groups"><h3>{{group.name}}</h3><dl class="record-fields"><template v-for="[key,value] in group.fields"><dt>{{key}}</dt><dd>{{display(value)}}</dd></template></dl></section></div><section class="panel"><div class="panel-title"><h3>传感器</h3><span class="muted">{{sensors.length}} 项</span></div><div class="table-scroll"><table><thead><tr><th>名称</th><th>厂商</th><th>类型</th><th>版本</th><th>量程</th><th>精度</th></tr></thead><tbody><tr v-for="(sensor,i) in sensors" :key="i"><td>{{sensor.name}}</td><td>{{sensor.vendor}}</td><td>{{sensorType(sensor.type)}}</td><td>{{display(sensor.version)}}</td><td>{{display(sensor.maxRange)}}</td><td>{{display(sensor.resolution)}}</td></tr></tbody></table></div><p v-if="!sensors.length" class="muted">传感器信息未提供</p></section></template>
  <template v-if="tab==='apps'"><section class="panel"><h3>接入应用</h3><dl v-if="application" class="record-fields"><dt>应用包名</dt><dd>{{application.package}}</dd><dt>应用版本</dt><dd>{{application.versionName}} · {{application.versionCode}}</dd><dt>安装来源</dt><dd>{{application.installer||'来源未提供'}}</dd><dt>签名 SHA-256</dt><dd><code v-for="digest in application.signers" class="full-digest">{{digest}}</code></dd></dl><p v-else class="muted">当前上报没有应用版本与签名信息</p></section><section class="panel"><h3>指定系统应用</h3><div class="table-scroll"><table><thead><tr><th>应用</th><th>状态</th><th>版本</th><th>类型</th><th>签名证书</th></tr></thead><tbody><tr v-for="item in packages" :key="item.package"><td><strong>{{packageName(item.package)}}</strong><small>{{item.package}}</small></td><td>{{{visible:'已采集',not_visible_or_absent:'未检出',permission_denied:'未授权'}[item.status]||item.status}}</td><td>{{display(item.version)}}</td><td>{{item.status==='visible'?(item.system?'系统应用':'普通应用'):'—'}}</td><td><details v-if="item.signers?.length"><summary>查看 {{item.signers.length}} 个证书</summary><code v-for="digest in item.signers" class="full-digest">{{digest}}</code></details><span v-else>未提供</span></td></tr></tbody></table></div></section></template>
  <template v-if="tab==='network'"><div class="device-columns"><section class="panel"><h3>网络环境</h3><dl class="record-fields"><dt>服务端观测 IP</dt><dd>{{r.observedIp}}</dd><dt>IP 归属</dt><dd>{{r.resources?.ip?[r.resources.ip.country,r.resources.ip.province,r.resources.ip.city].filter(Boolean).join(' · '):'未匹配'}}</dd><dt>网络服务商</dt><dd>{{r.resources?.ip?.isp||'未匹配'}}</dd><dt>上网方式</dt><dd>{{transport(r.signals.transport?.value)}}</dd><dt>网络已验证</dt><dd>{{display(network?.validated)}}</dd><dt>VPN 连接</dt><dd>{{display(network?.vpn)}}</dd><dt>移动网络运营号</dt><dd>{{display(r.signals.operator?.value)}}</dd><dt>Wi-Fi 信号</dt><dd>{{r.signals.wifiRssi?.value!=null?r.signals.wifiRssi.value+' dBm':signalStatus('wifiRssi')}}</dd><dt>Wi-Fi 接入点</dt><dd>{{display(r.signals.bssid?.value)}}</dd></dl></section><section class="panel"><h3>定位快照</h3><span class="device-status">{{signalStatus('location')}}</span><dl v-if="gps" class="record-fields"><dt>经纬度</dt><dd>{{gps.latitude}}, {{gps.longitude}}</dd><dt>精度</dt><dd>{{gps.accuracyMeters}} 米</dd><dt>样本年龄</dt><dd>{{Math.floor(gps.ageMillis/1000)}} 秒</dd><dt>坐标系</dt><dd>{{gps.coordinateSystem}}</dd><dt>提供方</dt><dd>{{gps.provider}}</dd><dt>模拟标记</dt><dd>{{display(gps.mock)}}</dd></dl><p v-else class="muted">{{signalReason('location')}}</p></section></div><section class="panel"><div class="panel-title"><h3>基站信息</h3><span class="device-status">{{signalStatus('cell')}}</span></div><div class="table-scroll" v-if="cells.length"><table><thead><tr><th>制式</th><th>MCC / MNC</th><th>区域码</th><th>Cell ID</th><th>驻网</th><th>信号</th><th>样本年龄</th></tr></thead><tbody><tr v-for="(cell,i) in cells" :key="i"><td>{{cell.technology}}</td><td>{{cell.mcc}} / {{cell.mnc}}</td><td>{{display(cell.areaCode)}}</td><td>{{display(cell.cellId)}}</td><td>{{display(cell.registered)}}</td><td>{{display(cell.dbm)}} dBm</td><td>{{cell.ageMillis!=null?Math.floor(cell.ageMillis/1000)+' 秒':'未提供'}}</td></tr></tbody></table></div><p v-else class="muted">{{signalReason('cell')}}</p></section></template>
  <template v-if="tab==='history'"><section class="panel"><h3>关联账号</h3><table v-if="selected.accounts.length"><thead><tr><th>账号</th><th>事件数</th><th>最近出现</th></tr></thead><tbody><tr v-for="account in selected.accounts"><td>{{account.accountId}}</td><td>{{account.events}}</td><td>{{date(account.lastSeen)}}</td></tr></tbody></table><p v-else class="muted">尚未关联业务账号</p></section><div class="device-columns"><section class="panel"><h3>最近上报</h3><div class="device-timeline" v-for="report in selected.reports"><span class="timeline-dot"></span><div><strong>{{purpose(report.purpose)}}</strong><small>{{date(report.receivedAt)}}</small><span>{{report.observedIp}} · {{proof(report.proof)}}</span></div></div></section><section class="panel"><h3>网络变化</h3><div class="device-timeline" v-for="entry in networkHistory"><span class="timeline-dot"></span><div><strong>{{entry.ip}}</strong><small>{{date(entry.time)}}</small><span>{{transport(entry.transport)}} · {{entry.region?[entry.region.province,entry.region.city,entry.region.isp].filter(Boolean).join(' / '):'归属未提供'}}</span></div></div></section></div></template>
  <section class="panel" v-if="tab==='raw'"><div class="panel-title"><h3>最近上报原始数据</h3><button class="quiet" @click="exportRecord">导出当前档案 ↓</button></div><pre class="device-raw">{{JSON.stringify(r,null,2)}}</pre></section>
 </template>
</div>
